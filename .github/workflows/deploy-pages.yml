name: Build & Deploy when-is-eid to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Monthly refresh on the 2nd of each month at 06:00 UTC to pull new SA decisions and rebuild
    - cron: '0 6 2 * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Refresh live South African sighting archives & recalibrate model
        continue-on-error: true
        run: |
          pip install -q numpy scipy beautifulsoup4
          python scripts/fetch_sa_history.py --live-only
          npm run build:data
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
